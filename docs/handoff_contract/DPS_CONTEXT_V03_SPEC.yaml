version: dps-context-v0.3
canonical_core_changed: false
san_changed: false
principle: Separate context production/control from canonical schema and from semantic norms.
packet:
  packet_id: string
  mode:
  - CANONICAL_BUILD
  - EXTERNAL_AUDIT
  - REPLAY
  root:
    source_unit_id: string
    version_id: string
    text_hash: sha256
  context_blocks:
  - block_id: string
    role:
    - ROOT_NORMATIVE
    - GOVERNING_NORMATIVE
    - TARGET_NORMATIVE
    - TEMPORAL_NORMATIVE
    - RETRIEVAL_CANDIDATE
    - EXTERNAL_AUDIT
    - EXPLANATORY
    support_eligible: boolean
    source_id: string
    version_id: string|null
    content_hash: sha256
    relation_to_root: string
    discovery_channel: string|null
  coverage:
    required_channels: array
    completed_channels: array
    residual_discovery_complete: boolean
    missing_context: array
  transform_decisions:
  - target_block_id: string
    kind:
    - NONE
    - EXPLICIT
    - CONTEXTUAL_INFERRED
    - AMBIGUOUS
    evidence_block_ids: array
    audit_status:
    - PASS
    - REVIEW_REQUIRED
    - REJECT
    - NOT_NEEDED
  temporal_binding:
    as_of: date|null
    event_anchor: string|null
    cutover_resolved: boolean
    mixed_versions: boolean
  shared_context_refs: array[block_id]
  commit_gate:
    version_bound: boolean
    structural_context_bound: boolean
    evidence_roles_valid: boolean
    candidate_coverage_complete: boolean
    transform_audit_clear: boolean
    temporal_binding_clear: boolean
rules:
- Canonical Facts may cite only support-eligible version-bound normative blocks.
- EXTERNAL_AUDIT and EXPLANATORY blocks never directly support canonical meaning.
- RETRIEVAL_CANDIDATE is not support until identity/version/evidence is verified and promoted.
- RESOLVED is prohibited when required candidate channels are incomplete or residual discovery is not complete.
- CONTEXTUAL_INFERRED or AMBIGUOUS transforms require a separate audit; ambiguity fails closed.
- Mixed current/future/historical versions prohibit semantic commit until temporal binding resolves them.
- Governing parent/header/annex context is referenced as shared blocks rather than duplicated into every child packet.
