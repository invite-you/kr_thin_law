name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: offline-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src/law_mcp tests
      - name: Mypy
        run: python -m mypy src/law_mcp

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Build distributions
        run: python -m build

  public-api-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Official public MCP wire smoke
        env:
          LAW_API_OC: test
        run: |
          python - <<'PY'
          import asyncio
          from mcp import Client
          from law_mcp.client import OfficialClient
          from law_mcp.server import create_server

          async def main():
              upstream = OfficialClient(
                  oc="test",
                  capture_dir=None,
                  timeout=20,
                  max_attempts=2,
              )
              server = create_server(upstream)
              async with Client(server) as client:
                  tools = await client.list_tools()
                  bundle = next(tool for tool in tools.tools if tool.name == "law_reference_bundle")
                  selector_schema = bundle.input_schema["properties"]["selector"]
                  assert selector_schema["type"] == "object"
                  assert "oneOf" not in selector_schema
                  assert "discriminator" not in selector_schema

                  result = await client.call_tool(
                      "law_reference_bundle",
                      {
                          "selector": {"mode": "current", "law_id": "1747"},
                          "text_mode": "graph_only",
                          "focus": {"targets": [{"article": 3}], "max_depth": 1},
                      },
                  )
                  assert result.is_error is False, result
                  body = result.structured_content
                  assert body["status"] == "OK"
                  assert int(body["source"]["law_id"]) == 1747
                  assert body["coverage"]["body_scan"] == "COMPLETE_FOR_POLICY"
                  assert len(upstream.attempts) == 2
                  print({
                      "law": body["source"]["title"],
                      "articles": body["coverage"]["counts"]["document_articles"],
                      "edges": body["coverage"]["counts"]["reference_edges"],
                      "attempts": len(upstream.attempts),
                  })

          asyncio.run(main())
          PY
