name: Provider error probe

on:
  push:
    branches:
      - fix/provider-error-propagation-4.9.1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe documented XML failure shapes
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          base = "https://www.law.go.kr/DRF/lawSearch.do"
          cases = [
              {"OC":"test","target":"law","type":"XML","query":"자동차관리법","display":"101"},
              {"OC":"test","target":"law","type":"XML","query":"자동차관리법","page":"0"},
              {"OC":"test","target":"definitely_invalid_target","type":"XML","query":"x"},
              {"OC":"test","target":"law","type":"XML","query":"자동차관리법","display":"-1"},
              {"OC":"definitely-invalid-credential","target":"law","type":"XML","query":"자동차관리법"},
              {"target":"law","type":"XML","query":"자동차관리법"},
          ]
          for i, params in enumerate(cases, 1):
              url = base + "?" + urllib.parse.urlencode(params)
              status = None
              body = b""
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      status = getattr(response, "status", 200)
                      body = response.read(200000)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read(200000)
              print("CASE", i, "HTTP", status, "BYTES", len(body))
              try:
                  root = ET.fromstring(body)
                  direct = {c.tag: (c.text or "").strip() for c in list(root) if len(c) == 0}
                  keep = {k: direct.get(k,"") for k in ("resultCode","resultMsg","errMsg","returnAuthMsg","returnReasonCode") if k in direct}
                  nested = {}
                  for tag in ("resultCode","resultMsg","errMsg","returnAuthMsg","returnReasonCode"):
                      node = root.find(".//" + tag)
                      if node is not None:
                          nested[tag] = (node.text or "").strip()
                  leaf = {}
                  for node in root.iter():
                      if node is root or len(node):
                          continue
                      value = (node.text or "").strip()
                      if value:
                          leaf[node.tag] = value[:200]
                  print("ROOT", root.tag, "DIRECT", keep, "NESTED", nested, "LEAF", leaf)
              except Exception as exc:
                  print("PARSE", type(exc).__name__, body[:120].decode("utf-8","replace"))
          PY
